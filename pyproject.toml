[project]
name = "handmouse"
version = "0.1.0"
description = "Gesture-controlled mouse daemon (webcam hand tracking) for Hyprland/Wayland"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe",
    "opencv-python",
    "evdev",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
handmouse = "handmouse.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["handmouse"]
